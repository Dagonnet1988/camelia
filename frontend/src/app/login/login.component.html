<div class="auth-page">
  <form class="auth-card" (ngSubmit)="ingresar()">
    <div class="logo-badge">
      <img src="brand/logo-maestro.png" alt="Camelia — Detalles que te hacen especial" width="247" height="158" />
    </div>

    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <div class="field">
      <label>Usuario</label>
      <input name="usuario" [(ngModel)]="usuario" autocomplete="username" required autofocus />
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password" required />
    </div>

    <button class="btn" type="submit" [disabled]="enviando()">Ingresar</button>
  </form>
</div>
