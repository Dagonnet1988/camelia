<div class="auth-page">
  <form class="auth-card" (ngSubmit)="guardar()">
    <h1>Cambiar contraseña</h1>
    <p class="subtitulo">
      @if (esPrimerCambio) {
        Es tu primer ingreso — debes definir una contraseña nueva antes de continuar.
      } @else {
        Actualiza tu contraseña cuando quieras.
      }
    </p>

    @if (error()) {
      <div class="alert-error">{{ error() }}</div>
    }

    <div class="field">
      <label>Contraseña actual</label>
      <input type="password" name="passwordActual" [(ngModel)]="passwordActual" autocomplete="current-password" required />
    </div>
    <div class="field">
      <label>Contraseña nueva</label>
      <input type="password" name="passwordNueva" [(ngModel)]="passwordNueva" autocomplete="new-password" required />
    </div>
    <div class="field">
      <label>Confirmar contraseña nueva</label>
      <input type="password" name="passwordConfirmar" [(ngModel)]="passwordConfirmar" autocomplete="new-password" required />
    </div>

    <button class="btn" type="submit" [disabled]="enviando()">Guardar</button>
  </form>
</div>
