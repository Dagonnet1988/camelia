@if (auth.usuario(); as u) {
  <nav class="main-nav">
    <span class="brand">Camelia</span>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
    <a routerLink="/productos" routerLinkActive="active">Productos</a>
    <a routerLink="/compras" routerLinkActive="active">Compras</a>
    <a routerLink="/compradores" routerLinkActive="active">Compradores</a>
    <a routerLink="/ventas" routerLinkActive="active">Ventas</a>
    <a routerLink="/whatsapp" routerLinkActive="active">WhatsApp</a>
    <a routerLink="/difusion" routerLinkActive="active">Difusion</a>
    @if (u.rol === 'admin') {
      <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
    }
    <span class="nav-spacer"></span>
    <span class="nav-usuario">{{ u.nombre }}</span>
    <button class="nav-logout" type="button" (click)="cerrarSesion()">Cerrar sesion</button>
  </nav>
}
<router-outlet />
